# Sends steady traffic (about 5 requests/second) so there are metrics to judge.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - while true; do curl -s -o /dev/null --max-time 2 http://demo-app/; sleep 0.2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
